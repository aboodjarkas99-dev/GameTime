name: GameTime Full Code Handoff

on:
  push:
    branches:
      - secure-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out secure-v2 source
        uses: actions/checkout@v4

      - name: Build handoff manifest
        shell: bash
        run: |
          mkdir -p HANDOFF_PACKAGE
          cat > HANDOFF_PACKAGE/SNAPSHOT_MANIFEST.txt <<EOF
          GameTime Full Code Handoff
          Repository: aboodjarkas99-dev/GameTime
          Branch: secure-v2
          Commit: $GITHUB_SHA
          Generated UTC: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          Production URL: https://gametime-secure-v2.vercel.app
          Supabase project ref: bqnptjfdsxzbxtkzigim
          EOF

      - name: Create complete source archive
        shell: bash
        run: |
          zip -rq "GameTime-Full-Code-$GITHUB_SHA.zip" . -x ".git/*"

      - name: Upload handoff archive
        uses: actions/upload-artifact@v4
        with:
          name: GameTime-Full-Code
          path: GameTime-Full-Code-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 90

      - name: Fetch full-detail Excel backup
        shell: bash
        run: |
          curl -fL --retry 2 "https://bqnptjfdsxzbxtkzigim.supabase.co/storage/v1/object/sign/gametime-backups/latest/GameTime-Latest.xlsx?token=eyJraWQiOiJhYTE1Y2UzMy0xY2M0LTRlMTYtOGFiOS1hZjYyZTc5NjU5YjgiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJnYW1ldGltZS1iYWNrdXBzL2xhdGVzdC9HYW1lVGltZS1MYXRlc3QueGxzeCIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3OTQzMjgwNzksImV4cCI6MTc5NDMyODM3OX0.CxIdCCtLVDArq9udfAHm49FE9APOg0Io9xTRTw0ClGb8Qq2Y4qxsFwbu7gWBm0cmtdR0Fr50c5skVGCEI_CLxA" -o GameTime-Full-Detail-Backup.xlsx
          test -s GameTime-Full-Detail-Backup.xlsx

      - name: Upload full-detail Excel artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameTime-Full-Detail-Excel
          path: GameTime-Full-Detail-Backup.xlsx
          if-no-files-found: error
          retention-days: 1
