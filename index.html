<html lang="en">

<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dde4ec;--dark:#111827;--green:#15803d;--red:#dc2626;--amber:#d97706;--blue:#2563eb}
*{box-sizing:border-box}html{touch-action:manipulation;-webkit-text-size-adjust:100%}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:40;background:var(--dark);color:#fff;padding:13px 17px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:17px;font-weight:900}.sub{font-size:10px;color:#cbd5e1;margin-top:2px}.clock{font-size:17px;font-weight:900}.wrap{max-width:1550px;margin:auto;padding:12px}
.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.toolbar button,.toolbar input{min-height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px}.datebox{min-width:245px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-weight:900}.grow{flex:1;min-width:230px}.primary{background:var(--dark)!important;color:#fff!important;border-color:var(--dark)!important;font-weight:900}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:9px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.stat span{display:block;color:var(--muted);font-size:9px}.stat b{font-size:19px}
.managergrid{display:grid;grid-template-columns:1fr;gap:12px}.mainarea{min-width:0}.board{display:grid;grid-template-columns:1fr 1fr;gap:28px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.panelhead{padding:9px 11px;border-bottom:1px solid var(--line);background:#f8fafc;display:flex;align-items:center;justify-content:space-between}.panelhead h2{font-size:14px;margin:0}.panelhead small{font-size:9px;color:var(--muted);font-weight:900}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px;box-shadow:0 2px 7px rgba(15,23,42,.04)}.order{font-size:8px;font-weight:900;color:#64748b;letter-spacing:.07em}.productrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-right:87px}.productrow h3{font-size:16px;margin:3px 0 5px}.batch{background:#111827;color:#fff;border-radius:6px;padding:5px 7px;font-size:9px;font-weight:900}.tank{position:absolute;right:8px;top:8px;background:#172033;color:#fff;border-radius:8px;min-width:75px;text-align:center;padding:6px}.tank b{display:block;font-size:13px}.tank span{font-size:6px;color:#cbd5e1}.note{margin-top:6px;border-left:3px solid #64748b;background:#f8fafc;border-radius:5px;padding:6px 7px;font-size:9px}
.qty{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.pkg{position:relative;border:1px solid var(--line);background:#f8fafc;border-radius:8px;text-align:center;padding:7px 4px;min-height:58px;cursor:pointer;user-select:none}.pkg b{display:block;font-size:15px;overflow-wrap:anywhere}.pkg span,.pkg small{display:block;font-size:7px;color:#64748b;font-weight:900;margin-top:2px}.pkg.pkgdone{border:2px solid #22c55e;background:#f0fdf4}.pkg.pkgpartial{border:2px solid #f59e0b;background:#fffbeb}.pkgmark{position:absolute;right:4px;top:3px;font-size:12px;font-weight:900;color:#15803d}
.precheck{display:flex;align-items:center;gap:9px;border:2px solid #ef4444;background:#fff7f7;color:#991b1b;border-radius:8px;padding:7px;margin-top:7px;cursor:pointer}.precheck.ok{border-color:#22c55e;background:#f0fdf4;color:#166534}.precheck input{display:none}.sq{width:32px;height:32px;min-width:32px;border:2px solid currentColor;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}.checktxt b{display:block;font-size:8px;letter-spacing:.05em}.checktxt small{font-size:9px;font-weight:800}
.status{margin-top:6px;border-radius:7px;padding:6px;text-align:center;font-size:9px;font-weight:900}.ready{background:#f1f5f9;color:#64748b}.progress{background:#fef3c7;color:#92400e}.done{background:#dcfce7;color:#166534}.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}.actions button{border:0;border-radius:7px;min-height:38px;color:#fff;font-size:9px;font-weight:900}.start{background:var(--amber)}.finish{background:var(--green)}.hold{grid-column:1/-1;background:#475569}.locked{opacity:.3}.manage{display:flex;gap:4px;margin-top:5px}.manage button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 7px;font-size:8px}
.side{display:flex;flex-direction:column;gap:10px}.sidebox{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}.sidehead{padding:9px 10px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11px;font-weight:900}.feed,.queue{max-height:370px;overflow:auto}.event,.queueitem{padding:8px 9px;border-bottom:1px solid #edf1f5;font-size:9px}.event:last-child,.queueitem:last-child{border-bottom:0}.event b,.queueitem b{display:block;font-size:10px}.event small,.queueitem small{color:#64748b}.event.startEv{border-left:3px solid #d97706}.event.doneEv{border-left:3px solid #16a34a}.event.packEv{border-left:3px solid #2563eb}.queueitem input{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:7px;padding:7px}.queueitem button{width:100%;margin-top:5px;border:0;border-radius:7px;background:#111827;color:#fff;padding:7px;font-size:8px;font-weight:900}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.62);z-index:100;padding:12px;overflow:auto}.modal.show{display:flex;align-items:flex-start;justify-content:center}.dialog{margin-top:18px;background:#fff;width:min(860px,100%);border-radius:14px;padding:13px}.dialoghead{display:flex;align-items:center;gap:8px}.dialoghead h2{margin:0;flex:1;font-size:17px}.dialoghead button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:11px}.grid label{font-size:9px;font-weight:900}.grid input,.grid select{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:9px}.full{grid-column:1/-1}.auto{border:1px solid var(--line);background:#f8fafc;border-radius:8px;padding:8px}.autobtns{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:5px}.autobtns button{border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:8px;font-size:9px;font-weight:900}.autobtns button.on{background:#111827;color:#fff}.summary{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:9px}.dialogactions{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}.dialogactions button{border:1px solid var(--line);border-radius:7px;padding:8px 11px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:9px;min-width:680px}.dow{text-align:center;font-size:8px;font-weight:900;color:#64748b}.day{min-height:82px;border:1px solid var(--line);border-radius:7px;padding:5px;background:#fff;cursor:pointer}.day.empty{background:#f8fafc}.day.good{background:#dcfce7;border-color:#86efac}.day.bad{background:#fee2e2;border-color:#fca5a5}.day.today{outline:2px solid #2563eb}.daynum{font-weight:900}.day small{display:block;font-size:7px;margin-top:3px}.monthdialog{width:min(900px,100%);overflow:auto}
.pinbox{width:min(360px,100%);text-align:center}.pinbox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:10px 0}.pinbox button{width:100%;padding:11px}

.managerquick{display:none;gap:6px;align-items:center}
.managerquick button{min-height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-size:9px;font-weight:900}
.shareactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.shareactions button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px 10px;font-size:9px;font-weight:900}.shareactions button.prodshare{background:#111827;color:#fff}.shareactions button.batchshare{background:#334155;color:#fff}
.draghandle{display:inline-flex;align-items:center;gap:5px;margin:0 0 4px;padding:4px 7px;border:1px dashed #94a3b8;border-radius:6px;background:#f8fafc;color:#475569;font-size:8px;font-weight:900;cursor:grab;user-select:none;touch-action:none}.draghandle:active{cursor:grabbing}.card.dragging{opacity:.45}.card.dropzone{outline:2px dashed #2563eb;outline-offset:2px}
.holdlineitem{padding:9px;border-bottom:1px solid #edf1f5}.holdlineitem:last-child{border-bottom:0}.holdlineitem b{display:block;font-size:10px}.holdlineitem small{display:block;color:#64748b;font-size:8px;margin-top:2px}.holdlineitem .holdactions{display:grid;grid-template-columns:1fr auto;gap:5px;margin-top:6px}.holdlineitem input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px}.holdlineitem button{border:0;border-radius:7px;background:#111827;color:#fff;padding:7px 9px;font-size:8px;font-weight:900}.holdlineitem .secondary{background:#fff;color:#111827;border:1px solid var(--line)}
.drawerbackdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:150;padding:12px}
.drawerbackdrop.show{display:flex;align-items:flex-start;justify-content:flex-end}
.drawer{margin-top:55px;width:min(420px,100%);max-height:80vh;background:#fff;border-radius:13px;box-shadow:0 16px 45px rgba(0,0,0,.24);overflow:hidden}
.drawerhead{display:flex;align-items:center;gap:8px;padding:10px 11px;background:#f8fafc;border-bottom:1px solid var(--line)}
.drawerhead h3{flex:1;margin:0;font-size:13px}
.drawerhead button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 9px}
.drawerbody{max-height:calc(80vh - 48px);overflow:auto}
@media(max-width:720px){.top{padding:11px 12px}.brand{font-size:14px}.clock{font-size:15px}.wrap{padding:8px}.toolbar{display:grid;grid-template-columns:1fr 1fr}.datebox,.grow,.toolbar .wide,.toolbar .primary{grid-column:1/-1}.toolbar button,.toolbar input{min-height:44px}.stats{grid-template-columns:repeat(2,1fr);gap:5px}.board{grid-template-columns:1fr;gap:12px}.side{grid-template-columns:1fr}.card{margin:7px}.actions button{min-height:45px}.grid{grid-template-columns:1fr}.full{grid-column:1}.pkg{min-height:64px}.sq{width:36px;height:36px;min-width:36px}.calendar{min-width:650px}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">GAMETIME FACTORY WORK BOARD</div><div class="sub" id="viewLabel">ALL WORK</div></div><div class="clock" id="clock"></div></header>
<main class="wrap">
<section class="toolbar">
<button onclick="shift(-1)">← Previous</button><div class="datebox" id="dateLabel"></div><button onclick="shift(1)">Next →</button>
<button onclick="openMonth()">▦ Month View</button>
<input id="search" class="grow" placeholder="Search Product or Batch #" oninput="render()">
<button class="wide" id="printBtn" onclick="printMenu()">Print / Save PDF</button>
<span class="managerquick" id="managerQuick"><button onclick="openDrawer('activity')">● Live Activity</button><button onclick="openDrawer('queue')">☰ Unfinished Queue</button><button onclick="openDrawer('holdline')">▣ HOLD LINE</button></span>
<button class="primary" id="addBtn" onclick="openEditor()">+ Add Work Order</button>
</section>
<div class="sharehint" id="shareHint"></div>
<section class="stats"><div class="stat"><span>Work Orders</span><b id="sOrders">0</b></div><div class="stat"><span>Batch Tasks</span><b id="sBatch">0</b></div><div class="stat"><span>Production Tasks</span><b id="sProd">0</b></div><div class="stat"><span>Completed</span><b id="sDone">0</b></div></section>
<div class="managergrid" id="managerGrid"><div class="mainarea"><section class="board" id="board"><div class="panel" id="batchPanel"><div class="panelhead"><h2>Batch Maker</h2><small id="batchCount"></small></div><div id="batchList"></div></div><div class="panel" id="prodPanel"><div class="panelhead"><h2>Production / Filling</h2><small id="prodCount"></small></div><div id="prodList"></div></div></section></div>
<aside class="side" id="side" style="display:none"><section class="sidebox"><div class="sidehead">LIVE ACTIVITY</div><div class="feed" id="feed"></div></section><section class="sidebox"><div class="sidehead">UNFINISHED QUEUE</div><div class="queue" id="queue"></div></section></aside></div>
</main>

<div class="modal" id="editor"><div class="dialog"><div class="dialoghead"><h2 id="editTitle">Add Work Order</h2><button onclick="closeEditor()">✕</button></div><input type="hidden" id="editId"><div class="grid">
<label class="full">Product Name<input id="product"></label><label>Date<input id="workDate" type="date"></label><label>Batch Number<input id="batchNumber"></label><label>Total Batch Gallons<input id="tank" inputmode="decimal" oninput="recalc()"></label><label>Priority<select id="priority"><option>Normal</option><option>Rush</option><option>First Thing Morning</option></select></label>
<div class="full auto"><b>Auto-fill Remaining Gallons Into</b><div class="autobtns"><button data-a="five" type="button" onclick="toggleAuto('five')">5 Gallon</button><button data-a="gallon" type="button" onclick="toggleAuto('gallon')">1 Gallon</button><button data-a="quart" type="button" onclick="toggleAuto('quart')">Quarts</button></div></div>
<label>Quarts<input id="quart" oninput="recalc()"><small id="qBoxes"></small></label><label>1 Gallon<input id="gallon" oninput="recalc()"><small id="gBoxes"></small></label><label>5 Gallon<input id="five" oninput="recalc()"></label><div class="full summary" id="calc"></div>
<label class="full">Batch Maker Note<input id="batchNote"></label><label class="full">Production Note<input id="prodNote"></label>
</div><div class="dialogactions"><button onclick="closeEditor()">Cancel</button><button class="primary" onclick="saveOrder()">Save Work Order</button></div></div></div>

<div class="modal" id="monthModal"><div class="dialog monthdialog"><div class="dialoghead"><button onclick="monthShift(-1)">←</button><h2 id="monthTitle"></h2><button onclick="monthShift(1)">→</button><button onclick="closeMonth()">✕</button></div><div class="calendar" id="calendar"></div></div></div>
<div class="drawerbackdrop" id="managerDrawer" onclick="if(event.target===this)closeDrawer()">
  <div class="drawer">
    <div class="drawerhead"><h3 id="drawerTitle"></h3><button onclick="closeDrawer()">✕</button></div>
    <div class="drawerbody" id="drawerBody"></div>
  </div>
</div>

<script>
const KEY='gametime_factory_orders_v2',LOGKEY='gametime_activity_v1';
let params=new URLSearchParams(location.search),view=params.get('view')||'all',managerMode=params.get('manager')==='1'||view==='all',orders=JSON.parse(localStorage.getItem(KEY)||'[]'),logs=JSON.parse(localStorage.getItem(LOGKEY)||'[]'),selected=new Date(),monthCursor=new Date(),autoTarget=null,editorHoldLine=false,dragState=null;selected.setHours(12,0,0,0);orders.forEach((o,i)=>{if(o.batchOrder==null)o.batchOrder=i+1;if(o.prodOrder==null)o.prodOrder=i+1;if(o.holdLine==null)o.holdLine=false;if(!o.actual)o.actual={quart:null,gallon:null,five:null}});save();
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function save(){localStorage.setItem(KEY,JSON.stringify(orders))}function saveLogs(){localStorage.setItem(LOGKEY,JSON.stringify(logs.slice(0,200)))}function num(v){let m=String(v||'').match(/-?\d+(?:\.\d+)?/);return m?Math.max(0,Number(m[0])||0):0}function boxes(n){return Math.ceil(num(n)/4)}
function prodBatch(v){let m=String(v||'').trim().match(/^(.*?)(\d+)\s*$/);return m?m[1]+String(Number(m[2])+1).padStart(m[2].length,'0'):String(v||'')}function pretty(d=selected){return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function logEvent(o,dept,type,extra=''){logs.unshift({ts:Date.now(),date:iso(new Date()),product:o.product,dept,type,extra});saveLogs()}
function seed(){if(orders.length)return;let d=iso(selected);orders=[{id:Date.now(),date:d,product:'Alpha Satin',batch:'GT-245',tank:600,quart:'0',gallon:'0',five:'120',batchNote:'Prepare batch for production.',prodNote:'Fill 5 gallon containers first.',batchChecked:false,prodChecked:false,batchStatus:'ready',prodStatus:'ready',held:false,actual:{quart:null,gallon:null,five:null},priority:'Normal',batchOrder:1,prodOrder:1,holdLine:false},{id:Date.now()+1,date:d,product:'Omega',batch:'GT-246',tank:510,quart:'300',gallon:'150',five:'60',batchNote:'Confirm raw materials before starting.',prodNote:'300 quarts • 150 gallons • 60 five-gallon.',batchChecked:false,prodChecked:false,batchStatus:'ready',prodStatus:'ready',held:false,actual:{quart:null,gallon:null,five:null},priority:'Normal',batchOrder:2,prodOrder:2,holdLine:false}];save()}
function shift(n){selected.setDate(selected.getDate()+n);render()}function statusText(s){return s==='done'?'✓ COMPLETED':s==='progress'?'● IN PROGRESS':'○ NOT STARTED'}function sclass(s){return s==='done'?'done':s==='progress'?'progress':'ready'}
function planned(o,k){return num(o[k])}function actual(o,k){return o.actual&&o.actual[k]!=null?Number(o.actual[k]):null}function pkgClass(o,k){let a=actual(o,k),p=planned(o,k);if(a==null)return'';return a>=p?'pkgdone':'pkgpartial'}
function packageCard(o,k,label){let a=actual(o,k),p=planned(o,k),shown=esc(o[k]),mark=a==null?'':(a>=p?'✓':'◐');return '<div class="pkg '+pkgClass(o,k)+'" onclick="recordQty('+o.id+',\''+k+'\')"><span class="pkgmark">'+mark+'</span><b>'+shown+'</b><span>'+label+'</span><small>'+(a==null?(k==='five'?'Tap when filled':boxes(o[k])+' BOXES • Tap when filled'):'ACTUAL '+a+' / '+p)+'</small></div>'}
function card(o,dept,i){let checked=o[dept+'Checked'],st=o[dept+'Status'],bn=dept==='prod'?prodBatch(o.batch):o.batch,note=dept==='prod'?o.prodNote:o.batchNote,drag=managerMode?' draggable="true" data-id="'+o.id+'" data-dept="'+dept+'" ondragstart="dragStart(event,'+o.id+',\''+dept+'\')" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropCard(event,'+o.id+',\''+dept+'\')" ondragend="dragEnd(event)"':'';return '<article class="card"'+drag+'>'+(managerMode?'<div class="draghandle" data-id="'+o.id+'" data-dept="'+dept+'">☰ DRAG TO REORDER</div>':'')+<div class="tank"><b>'+esc(o.tank||'—')+'</b><span>TANK GAL</span></div><div class="order">'+(dept==='prod'?'FILLING':'BATCH')+' PRIORITY #'+(i+1)+'</div><div class="productrow"><h3>'+esc(o.product)+'</h3>'+(bn?'<span class="batch">BATCH # '+esc(bn)+'</span>':'')+'</div>'+(o.held?'<div class="note"><b>ON HOLD</b></div>':'')+(dept==='prod'?'<div class="qty">'+packageCard(o,'quart','QUARTS')+packageCard(o,'gallon','1 GALLON')+packageCard(o,'five','5 GALLON')+'</div>'+(note?'<div class="note"><b>Production Note:</b> '+esc(note)+'</div>':''):'<div class="note">'+esc(note||'Prepare batch for production.')+'</div>')+'<label class="precheck '+(checked?'ok':'')+'"><input type="checkbox" '+(checked?'checked':'')+' onchange="check('+o.id+',\''+dept+'\',this.checked)"><span class="sq">'+(checked?'✓':'')+'</span><span class="checktxt"><b>PRE-CHECK</b><small>'+(dept==='prod'?'Labels • Pallets • Containers / Cans':'All raw materials are available and ready')+'</small></span></label><div class="status '+sclass(st)+'">'+statusText(st)+'</div><div class="actions"><button class="start '+(checked?'':'locked')+'" onclick="act('+o.id+',\''+dept+'\',\'progress\')">▶ START WORK</button><button class="finish '+(checked?'':'locked')+'" onclick="act('+o.id+',\''+dept+'\',\'done\')">✓ WORK DONE</button><button class="hold" onclick="hold('+o.id+')">'+(o.held?'RESUME WORK':'PUT ON HOLD')+'</button></div>'+(managerMode?'<div class="manage"><button onclick="openEditor('+o.id+')">Edit</button><button onclick="del('+o.id+')">Delete</button></div>':'')+'</article>'}
function recordQty(id,k){if(view!=='prod'&&!managerMode)return;let o=orders.find(x=>x.id===id),p=planned(o,k),cur=actual(o,k),label=k==='quart'?'Quarts':k==='gallon'?'1 Gallon':'5 Gallon';let v=prompt('Actual '+label+' filled:',cur==null?String(p):String(cur));if(v===null)return;v=num(v);o.actual=o.actual||{};o.actual[k]=v;logEvent(o,'Production','package',label+': '+v+' / '+p);save();render()}
function allPackagesRecorded(o){return ['quart','gallon','five'].filter(k=>planned(o,k)>0).every(k=>actual(o,k)!=null)}
function check(id,d,v){let o=orders.find(x=>x.id===id);o[d+'Checked']=v;save();render()}
function act(id,d,s){let o=orders.find(x=>x.id===id);if(!o[d+'Checked']){alert('Complete the PRE-CHECK first.');return}if(d==='prod'&&s==='done'&&!allPackagesRecorded(o)){alert('Tap each planned quantity box and enter the actual amount filled before WORK DONE.');return}o[d+'Status']=s;logEvent(o,d,s==='progress'?'start':'done');save();render()}
function hold(id){let o=orders.find(x=>x.id===id);o.held=!o.held;logEvent(o,view==='batch'?'batch':'prod',o.held?'hold':'resume');save();render()}
function reorderTo(dragId,targetId,dept){if(dragId===targetId)return;let key=dept+'Order',day=orders.filter(o=>!o.holdLine&&o.date===iso(selected)).sort((a,b)=>(a[key]||999)-(b[key]||999)),from=day.findIndex(o=>o.id===dragId),to=day.findIndex(o=>o.id===targetId);if(from<0||to<0)return;let item=day.splice(from,1)[0];day.splice(to,0,item);day.forEach((o,i)=>o[key]=i+1);save();render()}

function del(id){if(confirm('Delete this work order?')){orders=orders.filter(o=>o.id!==id);save();render()}}

function renderQueue(){if(!managerMode)return;let today=iso(new Date()),q=orders.filter(o=>!o.holdLine&&o.date<today&&(o.batchStatus!=='done'||o.prodStatus!=='done'));document.getElementById('queue').innerHTML=q.map(o=>'<div class="queueitem"><b>'+esc(o.product)+(o.batch?' • '+esc(o.batch):'')+'</b><small>From '+o.date+' • '+(o.batchStatus!=='done'?'Batch unfinished ':'')+(o.prodStatus!=='done'?'Production unfinished':'')+'</small><input id="res-'+o.id+'" type="date" value="'+iso(selected)+'"><button onclick="reschedule('+o.id+')">Schedule on selected date</button></div>').join('')||'<div class="queueitem">Nothing unfinished.</div>'}
function renderHoldLineHTML(){let q=orders.filter(o=>o.holdLine);return '<div style="padding:8px"><button class="primary" style="width:100%;padding:9px;border:0;border-radius:8px" onclick="openHoldLineEditor()">+ Add Hold Line Item</button></div>'+ (q.map(o=>'<div class="holdlineitem"><b>'+esc(o.product)+(o.batch?' • '+esc(o.batch):'')+'</b><small>'+(o.tank?o.tank+' gal • ':'')+esc(o.batchNote||'No date assigned yet')+'</small><div class="holdactions"><input id="hold-date-'+o.id+'" type="date" value="'+iso(selected)+'"><button onclick="scheduleHoldLine('+o.id+')">Schedule</button></div><div class="holdactions"><button class="secondary" onclick="openEditor('+o.id+',true)">Edit</button><button class="secondary" onclick="del('+o.id+')">Delete</button></div></div>').join('')||'<div class="queueitem">Hold Line is empty.</div>')}

function scheduleHoldLine(id){let o=orders.find(x=>x.id===id),d=document.getElementById('hold-date-'+id).value;if(!d)return;o.holdLine=false;o.date=d;let day=orders.filter(x=>!x.holdLine&&x.date===d);o.batchOrder=Math.max(0,...day.map(x=>x.batchOrder||0))+1;o.prodOrder=Math.max(0,...day.map(x=>x.prodOrder||0))+1;logEvent(o,'Manager','scheduled','From Hold Line to '+d);save();selected=new Date(d+'T12:00:00');closeDrawer();render()}
function baseDir(){return location.href.split('?')[0].replace(/[^/]*$/,'')}
async function shareDept(dept){let url=baseDir()+(dept==='prod'?'production.html':'batch-maker.html'),title=dept==='prod'?'Production Work Board':'Batch Maker Work Board';try{if(navigator.share){await navigator.share({title,text:'GameTime Factory Work Board',url});return}}catch(e){if(e&&e.name==='AbortError')return}try{await navigator.clipboard.writeText(url);alert(title+' link copied.')}catch(_){prompt('Copy this link:',url)}}

function openDrawer(type){
  if(sessionStorage.getItem('gtManager')!=='yes')return;
  renderFeed();
  renderQueue();
  drawerTitle.textContent=type==='activity'?'LIVE ACTIVITY':type==='queue'?'UNFINISHED QUEUE':'HOLD LINE';

  managerDrawer.classList.add('show');
}
function closeDrawer(){managerDrawer.classList.remove('show')}

function render(){document.getElementById('dateLabel').textContent=pretty();document.getElementById('viewLabel').textContent=view==='all'?'ALL WORK':view==='prod'?'PRODUCTION / FILLING':'BATCH MAKER';document.getElementById('addBtn').style.display=managerMode?'':'none';document.getElementById('side').style.display='none';document.getElementById('managerGrid').style.gridTemplateColumns='1fr';document.getElementById('managerQuick').style.display=managerMode?'inline-flex':'none';let q=document.getElementById('search').value.toLowerCase().trim(),day=orders.filter(o=>!o.holdLine&&o.date===iso(selected)&&(!q||(o.product+' '+o.batch+' '+prodBatch(o.batch)).toLowerCase().includes(q))),batchDay=[...day].sort((a,b)=>(a.batchOrder||999)-(b.batchOrder||999)),prodDay=[...day].sort((a,b)=>(a.prodOrder||999)-(b.prodOrder||999));document.getElementById('sOrders').textContent=day.length;document.getElementById('sBatch').textContent=day.length;document.getElementById('sProd').textContent=day.length;document.getElementById('sDone').textContent=day.filter(o=>o.batchStatus==='done').length+day.filter(o=>o.prodStatus==='done').length;document.getElementById('batchCount').textContent=day.length+' tasks';document.getElementById('prodCount').textContent=day.length+' tasks';document.getElementById('batchList').innerHTML=batchDay.map((o,i)=>card(o,'batch',i)).join('')||'<div class="card">No Batch Maker work.</div>';document.getElementById('prodList').innerHTML=prodDay.map((o,i)=>card(o,'prod',i)).join('')||'<div class="card">No Production work.</div>';document.getElementById('batchPanel').style.display=view==='prod'?'none':'';document.getElementById('prodPanel').style.display=view==='batch'?'none':'';document.getElementById('board').style.gridTemplateColumns=view==='all'?'1fr 1fr':'1fr';document.getElementById('shareHint').innerHTML=managerMode?'<b>Employee links:</b> Production and Batch Maker have their own read-only work-order views.':'<b>Employee view:</b> You can Check, Start, Hold, Fini function openEditor(id,forceHold=false){if(!managerMode)return;let o=orders.find(x=>x.id===id);editorHoldLine=forceHold||!!o?.holdLine;editor.classList.add('show');editTitle.textContent=editorHoldLine?(o?'Edit Hold Line Item':'Add Hold Line Item'):(o?'Edit Work Order':'Add Work Order');editId.value=o?.id||'';product.value=o?.product||'';workDate.value=editorHoldLine?'':(o?.date||iso(selected));workDate.disabled=editorHoldLine;batchNumber.value=o?.batch||'';tank.value=o?.tank||'';priority.value=o?.priority||'Normal';quart.value=o?.quart??'0';gallon.value=o?.gallon??'0';five.value=o?.five??'0';batchNote.value=o?.batchNote||'';prodNote.value=o?.prodNote||'';setAuto(o?.autoTarget||null)}

function saveOrder(){let id=Number(editId.value)||Date.now(),old=orders.find(o=>o.id===id),o=old||{id,batchChecked:false,prodChecked:false,batchStatus:'ready',prodStatus:'ready',held:false,actual:{quart:null,gallon:null,five:null},batchOrder:999,prodOrder:999,holdLine:false};Object.assign(o,{date:editorHoldLine?'':workDate.value,holdLine:editorHoldLine,product:product.value.trim().replace(/(^|\s)([a-z])/g,(m,s,c)=>s+c.toUpperCase()),batch:batchNumber.value.trim(),tank:num(tank.value),priority:priority.value,quart:quart.value.trim(),gallon:gallon.value.trim(),five:five.value.trim(),batchNote:batchNote.value.trim(),prodNote:prodNote.value.trim(),autoTarget});if(!o.product||(!editorHoldLine&&!o.date)){alert(editorHoldLine?'Enter Product Name':'Enter Product Name and Date');return}if(!old){if(!editorHoldLine){let day=orders.filter(x=>!x.holdLine&&x.date===o.date);o.batchOrder=Math.max(0,...day.map(x=>x.batchOrder||0))+1;o.prodOrder=Math.max(0,...day.map(x=>x.prodOrder||0))+1}orders.push(o)}save();if(editorHoldLine){closeEditor();openDrawer('holdline');render();return}selected=new Date(o.date+'T12:00:00');closeEditor();render()}
function dayState(d){let arr=orders.filter(o=>!o.holdLine&&o.date===d);if(!arr.length)return'empty';let complete=arr.every(o=>view==='batch'?o.batchStatus==='done':view==='prod'?o.prodStatus==='done':o.batchStatus==='done'&&o.prodStatus==='done');return complete?'good':'bad'}
function openMonth(){monthCursor=new Date(selected.getFullYear(),selected.getMonth(),1);monthModal.classList.add('show');renderMonth()}function closeMonth(){monthModal.classList.remove('show')}function monthShift(n){monthCursor.setMonth(monthCursor.getMonth()+n);renderMonth()}
function renderMonth(){monthTitle.textContent=monthCursor.toLocaleDateString('en-US',{month:'long',year:'numeric'});let html=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>'<div class="dow">'+x+'</div>').join(''),first=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());let today=iso(new Date());for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let di=iso(d),arr=orders.filter(o=>!o.holdLine&&o.date===di),done=arr.filter(o=>!incompleteForView(o)).length;html+='<div class="day '+dayState(di)+' '+(di===today?'today':'')+'" onclick="selected=new Date(\''+di+'T12:00:00\');closeMonth();render()"><div class="daynum">'+d.getDate()+'</div>'+(arr.length?'<small>'+done+' done / '+arr.length+' total</small>':'')+'</div>'}calendar.innerHTML=html}
