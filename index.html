<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GameTime Factory Work Board</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#182235;--muted:#6b7280;--line:#dbe2ea;--dark:#111827;--green:#16803c;--amber:#d98908;--red:#dc2626}
*{box-sizing:border-box}html{touch-action:manipulation}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer}.top{background:var(--dark);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:900;font-size:18px}.sub{font-size:10px;color:#cbd5e1;margin-top:3px}.clock{font-size:18px;font-weight:900}.wrap{max-width:1500px;margin:auto;padding:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.toolbar button,.toolbar input,.toolbar select{min-height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px}.datebox{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-weight:900;min-width:250px;text-align:center}.grow{flex:1;min-width:220px}.primary{background:var(--dark)!important;color:#fff!important;border-color:var(--dark)!important;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:11px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px;text-align:center}.stat span{display:block;font-size:10px;color:var(--muted)}.stat b{font-size:20px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:30px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.panelhead{padding:10px 12px;border-bottom:1px solid var(--line);background:#f8fafc;display:flex;justify-content:space-between;align-items:center}.panelhead h2{font-size:15px;margin:0}.panelhead small{font-weight:800;color:#64748b}
.card{position:relative;margin:8px;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:0 2px 7px rgba(15,23,42,.04)}.order{font-size:9px;color:#64748b;font-weight:900;letter-spacing:.06em}.productrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-right:90px}.productrow h3{margin:3px 0 5px;font-size:17px}.batch{background:#111827;color:#fff;border-radius:7px;padding:5px 8px;font-size:10px;font-weight:900}.tank{position:absolute;right:9px;top:9px;background:#172033;color:#fff;border-radius:9px;min-width:78px;padding:6px;text-align:center}.tank b{display:block;font-size:14px}.tank span{font-size:7px;color:#cbd5e1}.note{font-size:10px;background:#f8fafc;border-left:3px solid #64748b;border-radius:6px;padding:7px 8px;margin-top:7px}.qty{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.pkg{border:1px solid var(--line);background:#f8fafc;border-radius:8px;text-align:center;padding:6px 4px}.pkg b{display:block;font-size:15px;overflow-wrap:anywhere}.pkg span,.pkg small{display:block;font-size:8px;color:#64748b;font-weight:800;margin-top:2px}
.precheck{display:flex;align-items:center;gap:9px;border:2px solid #ef4444;background:#fff7f7;color:#991b1b;border-radius:9px;padding:8px;margin-top:8px;cursor:pointer}.precheck.ok{border-color:#22c55e;background:#f0fdf4;color:#166534}.precheck input{display:none}.sq{width:34px;height:34px;min-width:34px;border:2px solid currentColor;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}.checktxt b{display:block;font-size:9px;letter-spacing:.05em}.checktxt small{font-size:10px;font-weight:800}
.status{margin-top:7px;border-radius:8px;padding:7px;text-align:center;font-size:10px;font-weight:900}.ready{background:#f1f5f9;color:#64748b}.progress{background:#fef3c7;color:#92400e}.done{background:#dcfce7;color:#166534}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.actions button{border:0;color:#fff;border-radius:8px;min-height:40px;font-weight:900}.start{background:var(--amber)}.finish{background:var(--green)}.hold{grid-column:1/-1;background:#475569}.locked{opacity:.3}.manage{display:flex;gap:5px;margin-top:6px}.manage button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 8px;font-size:9px}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:100;padding:12px;overflow:auto}.modal.show{display:flex;justify-content:center;align-items:flex-start}.dialog{margin-top:18px;background:#fff;width:min(850px,100%);border-radius:14px;padding:14px}.dialoghead{display:flex;align-items:center;gap:8px}.dialoghead h2{margin:0;flex:1}.dialoghead button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.grid label{font-size:10px;font-weight:900}.grid input,.grid select{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:9px}.full{grid-column:1/-1}.auto{border:1px solid var(--line);border-radius:9px;background:#f8fafc;padding:8px}.autobtns{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:5px}.autobtns button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:9px;font-weight:900}.autobtns button.on{background:#111827;color:#fff}.summary{border:1px solid var(--line);border-radius:8px;background:#f8fafc;padding:8px;font-size:10px}.dialogactions{display:flex;justify-content:flex-end;gap:7px;margin-top:12px}.dialogactions button{border:1px solid var(--line);border-radius:8px;padding:9px 12px}.share{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;font-size:11px}.share a{word-break:break-all}
@media(max-width:720px){.top{padding:12px}.brand{font-size:15px}.clock{font-size:16px}.wrap{padding:9px}.toolbar{display:grid;grid-template-columns:1fr 1fr}.datebox,.grow,.toolbar .primary,.toolbar .wide{grid-column:1/-1}.toolbar button,.toolbar input{min-height:44px}.stats{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:1fr;gap:14px}.grid{grid-template-columns:1fr}.full{grid-column:1}.productrow{margin-right:86px}.actions button{min-height:46px}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">GAMETIME FACTORY WORK BOARD</div><div class="sub" id="viewLabel">MANAGER</div></div><div class="clock" id="clock"></div></header>
<main class="wrap">
<section class="toolbar">
<button onclick="shift(-1)">← Previous</button><div class="datebox" id="dateLabel"></div><button onclick="shift(1)">Next →</button>
<select id="viewSelect" onchange="setView(this.value)"><option value="manager">Manager</option><option value="batch">Batch Maker</option><option value="prod">Production</option></select>
<input class="grow" id="search" placeholder="Search Product or Batch #" oninput="render()">
<button class="wide" onclick="printFull()">Print / Save PDF — Full Day</button>
<button class="primary" id="addBtn" onclick="openEditor()">+ Add Work Order</button>
</section>
<div class="share" id="shareBox"></div>
<section class="stats"><div class="stat"><span>Work Orders</span><b id="sOrders">0</b></div><div class="stat"><span>Batch Maker Tasks</span><b id="sBatch">0</b></div><div class="stat"><span>Production Tasks</span><b id="sProd">0</b></div><div class="stat"><span>Completed</span><b id="sDone">0</b></div></section>
<section class="board" id="board"><div class="panel" id="batchPanel"><div class="panelhead"><h2>Batch Maker</h2><small id="batchCount"></small></div><div id="batchList"></div></div><div class="panel" id="prodPanel"><div class="panelhead"><h2>Production / Filling</h2><small id="prodCount"></small></div><div id="prodList"></div></div></section>
</main>
<div class="modal" id="editor"><div class="dialog"><div class="dialoghead"><h2 id="editTitle">Add Work Order</h2><button onclick="closeEditor()">✕</button></div><input type="hidden" id="editId">
<div class="grid">
<label class="full">Product Name<input id="product" placeholder="Type product name..."></label>
<label>Date<input id="workDate" type="date"></label><label>Batch Number<input id="batchNumber" placeholder="GT-245"></label>
<label>Total Batch Gallons<input id="tank" inputmode="decimal" oninput="recalc()"></label><label>Priority<select id="priority"><option>Normal</option><option>Rush</option><option>First Thing Morning</option></select></label>
<div class="full auto"><b>Auto-fill Remaining Gallons Into</b><div class="autobtns"><button type="button" data-a="five" onclick="toggleAuto('five')">5 Gallon</button><button type="button" data-a="gallon" onclick="toggleAuto('gallon')">1 Gallon</button><button type="button" data-a="quart" onclick="toggleAuto('quart')">Quarts</button></div></div>
<label>Quarts<input id="quart" oninput="recalc()"><small id="qBoxes"></small></label><label>1 Gallon<input id="gallon" oninput="recalc()"><small id="gBoxes"></small></label><label>5 Gallon<input id="five" oninput="recalc()"></label>
<div class="full summary" id="calc"></div>
<label class="full">Batch Maker Note<input id="batchNote"></label><label class="full">Production Note<input id="prodNote"></label>
</div><div class="dialogactions"><button onclick="closeEditor()">Cancel</button><button class="primary" onclick="saveOrder()">Save Work Order</button></div></div></div>
<script>
const KEY='gametime_factory_orders_v1';let orders=JSON.parse(localStorage.getItem(KEY)||'[]'),selected=new Date(),view=new URLSearchParams(location.search).get('view')||'manager',autoTarget=null;selected.setHours(12,0,0,0);
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function save(){localStorage.setItem(KEY,JSON.stringify(orders))}function boxes(n){return Math.ceil((Number(n)||0)/4)}function num(v){let m=String(v||'').match(/-?\d+(?:\.\d+)?/);return m?Math.max(0,Number(m[0])||0):0}
function prodBatch(v){let m=String(v||'').trim().match(/^(.*?)(\d+)\s*$/);return m?m[1]+String(Number(m[2])+1).padStart(m[2].length,'0'):String(v||'')}
function shift(n){selected.setDate(selected.getDate()+n);render()}function pretty(){return selected.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function seed(){if(orders.length)return;let d=iso(selected);orders=[{id:Date.now(),date:d,product:'Alpha Satin',batch:'GT-245',tank:600,quart:'0',gallon:'0',five:'120',batchNote:'Prepare batch for production.',prodNote:'Fill 5 gallon containers first.',batchChecked:false,prodChecked:false,batchStatus:'ready',prodStatus:'ready',held:false,priority:'Normal'},{id:Date.now()+1,date:d,product:'Omega',batch:'GT-246',tank:510,quart:'300',gallon:'150',five:'60',batchNote:'Confirm raw materials before starting.',prodNote:'300 quarts • 150 gallons • 60 five-gallon.',batchChecked:false,prodChecked:false,batchStatus:'ready',prodStatus:'ready',held:false,priority:'Normal'}];save()}
function setView(v){view=v;let u=new URL(location);if(v==='manager')u.searchParams.delete('view');else u.searchParams.set('view',v);history.replaceState({},'',u);render()}
function statusText(s){return s==='done'?'✓ COMPLETED':s==='progress'?'● IN PROGRESS':'○ NOT STARTED'}function sclass(s){return s==='done'?'done':s==='progress'?'progress':'ready'}
function card(o,dept,i){let checked=o[dept+'Checked'],st=o[dept+'Status'],bn=dept==='prod'?prodBatch(o.batch):o.batch,note=dept==='prod'?o.prodNote:o.batchNote;return '<article class="card"><div class="tank"><b>'+esc(o.tank||'—')+'</b><span>TANK GAL</span></div><div class="order">'+(dept==='prod'?'FILLING':'BATCH')+' PRIORITY #'+(i+1)+'</div><div class="productrow"><h3>'+esc(o.product)+'</h3>'+(bn?'<span class="batch">BATCH # '+esc(bn)+'</span>':'')+'</div>'+(o.held?'<div class="note"><b>ON HOLD</b></div>':'')+(dept==='prod'?'<div class="qty"><div class="pkg"><b>'+esc(o.quart)+'</b><span>QUARTS</span><small>'+boxes(num(o.quart))+' BOXES</small></div><div class="pkg"><b>'+esc(o.gallon)+'</b><span>1 GALLON</span><small>'+boxes(num(o.gallon))+' BOXES</small></div><div class="pkg"><b>'+esc(o.five)+'</b><span>5 GALLON</span></div></div>'+(note?'<div class="note"><b>Production Note:</b> '+esc(note)+'</div>':''):'<div class="note">'+esc(note||'Prepare batch for production.')+'</div>')+'<label class="precheck '+(checked?'ok':'')+'"><input type="checkbox" '+(checked?'checked':'')+' onchange="check('+o.id+',\''+dept+'\',this.checked)"><span class="sq">'+(checked?'✓':'')+'</span><span class="checktxt"><b>PRE-CHECK</b><small>'+(dept==='prod'?'Labels • Pallets • Containers / Cans':'All raw materials are available and ready')+'</small></span></label><div class="status '+sclass(st)+'">'+statusText(st)+'</div><div class="actions"><button class="start '+(checked?'':'locked')+'" onclick="act('+o.id+',\''+dept+'\',\'progress\')">▶ START WORK</button><button class="finish '+(checked?'':'locked')+'" onclick="act('+o.id+',\''+dept+'\',\'done\')">✓ WORK DONE</button><button class="hold" onclick="hold('+o.id+')">'+(o.held?'RESUME WORK':'PUT ON HOLD')+'</button></div>'+(view==='manager'?'<div class="manage"><button onclick="openEditor('+o.id+')">Edit</button><button onclick="move('+o.id+',-1)">↑</button><button onclick="move('+o.id+',1)">↓</button><button onclick="del('+o.id+')">Delete</button></div>':'')+'</article>'}
function render(){document.getElementById('dateLabel').textContent=pretty();document.getElementById('viewSelect').value=view;document.getElementById('viewLabel').textContent=view==='manager'?'MANAGER':view==='prod'?'PRODUCTION / FILLING':'BATCH MAKER';document.getElementById('addBtn').style.display=view==='manager'?'':'none';let q=document.getElementById('search').value.toLowerCase().trim(),day=orders.filter(o=>o.date===iso(selected)&&(!q||(o.product+' '+o.batch+' '+prodBatch(o.batch)).toLowerCase().includes(q)));document.getElementById('sOrders').textContent=day.length;document.getElementById('sBatch').textContent=day.length;document.getElementById('sProd').textContent=day.length;document.getElementById('sDone').textContent=day.filter(o=>o.batchStatus==='done').length+day.filter(o=>o.prodStatus==='done').length;document.getElementById('batchCount').textContent=day.length+' tasks';document.getElementById('prodCount').textContent=day.length+' tasks';document.getElementById('batchList').innerHTML=day.map((o,i)=>card(o,'batch',i)).join('')||'<div class="card">No Batch Maker work.</div>';document.getElementById('prodList').innerHTML=day.map((o,i)=>card(o,'prod',i)).join('')||'<div class="card">No Production work.</div>';document.getElementById('batchPanel').style.display=view==='prod'?'none':'';document.getElementById('prodPanel').style.display=view==='batch'?'none':'';document.getElementById('board').style.gridTemplateColumns=view==='manager'?'1fr 1fr':'1fr';let base=location.href.split('?')[0];document.getElementById('shareBox').innerHTML='<b>Share links:</b> Production: <a href="'+base+'?view=prod">'+base+'?view=prod</a> &nbsp; • &nbsp; Batch Maker: <a href="'+base+'?view=batch">'+base+'?view=batch</a>'}
function check(id,d,v){let o=orders.find(x=>x.id===id);o[d+'Checked']=v;save();render()}function act(id,d,s){let o=orders.find(x=>x.id===id);if(!o[d+'Checked']){alert('Complete the PRE-CHECK first.');return}o[d+'Status']=s;save();render()}function hold(id){let o=orders.find(x=>x.id===id);o.held=!o.held;save();render()}function del(id){if(confirm('Delete this work order?')){orders=orders.filter(o=>o.id!==id);save();render()}}function move(id,n){let day=orders.filter(o=>o.date===iso(selected)),idx=day.findIndex(o=>o.id===id),j=idx+n;if(j<0||j>=day.length)return;let a=orders.indexOf(day[idx]),b=orders.indexOf(day[j]);[orders[a],orders[b]]=[orders[b],orders[a]];save();render()}
function openEditor(id){let o=orders.find(x=>x.id===id);document.getElementById('editor').classList.add('show');document.getElementById('editTitle').textContent=o?'Edit Work Order':'Add Work Order';document.getElementById('editId').value=o?.id||'';document.getElementById('product').value=o?.product||'';document.getElementById('workDate').value=o?.date||iso(selected);document.getElementById('batchNumber').value=o?.batch||'';document.getElementById('tank').value=o?.tank||'';document.getElementById('priority').value=o?.priority||'Normal';document.getElementById('quart').value=o?.quart??'0';document.getElementById('gallon').value=o?.gallon??'0';document.getElementById('five').value=o?.five??'0';document.getElementById('batchNote').value=o?.batchNote||'';document.getElementById('prodNote').value=o?.prodNote||'';setAuto(o?.autoTarget||null)}
function closeEditor(){document.getElementById('editor').classList.remove('show')}function toggleAuto(t){setAuto(autoTarget===t?null:t)}function setAuto(t){autoTarget=t;document.querySelectorAll('[data-a]').forEach(b=>b.classList.toggle('on',b.dataset.a===t));['quart','gallon','five'].forEach(x=>document.getElementById(x).readOnly=x===t);recalc()}
function recalc(){let total=num(document.getElementById('tank').value);if(autoTarget){let used=0;['quart','gallon','five'].filter(x=>x!==autoTarget).forEach(x=>{let v=num(document.getElementById(x).value);used+=x==='five'?v*5:x==='gallon'?v:v*.25});let r=Math.max(0,total-used),v=autoTarget==='five'?Math.floor(r/5):autoTarget==='gallon'?Math.floor(r):Math.floor(r*4);document.getElementById(autoTarget).value=String(v)}let q=num(quart.value),g=num(gallon.value),f=num(five.value),used=f*5+g+q*.25,left=total-used;document.getElementById('qBoxes').textContent=Math.ceil(q/4)+' boxes';document.getElementById('gBoxes').textContent=Math.ceil(g/4)+' boxes';document.getElementById('calc').innerHTML='Total: <b>'+total+'</b> gal • Used: <b>'+used+'</b> gal • '+(Math.abs(left)<.001?'<b>Exact total ✓</b>':(left>0?'Unassigned: ':'Over: ')+'<b>'+Math.abs(left).toFixed(2)+'</b> gal')}
function saveOrder(){let id=Number(document.getElementById('editId').value)||Date.now(),old=orders.find(o=>o.id===id),o=old||{id,batchChecked:false,prodChecked:false,batchStatus:'ready',prodStatus:'ready',held:false};Object.assign(o,{date:workDate.value,product:product.value.trim().replace(/(^|\s)([a-z])/g,(m,s,c)=>s+c.toUpperCase()),batch:batchNumber.value.trim(),tank:num(tank.value),priority:priority.value,quart:quart.value.trim(),gallon:gallon.value.trim(),five:five.value.trim(),batchNote:batchNote.value.trim(),prodNote:prodNote.value.trim(),autoTarget});if(!o.product||!o.date){alert('Enter Product Name and Date');return}if(!old)orders.push(o);save();selected=new Date(o.date+'T12:00:00');closeEditor();render()}
function printFull(){let day=orders.filter(o=>o.date===iso(selected)),n=Math.max(day.length,1),scale=n<=4?1:n<=6?.88:n<=8?.75:n<=10?.64:.55,rows=(dept)=>day.map((o,i)=>'<div class="j"><div class="jt"><div><small>'+dept.toUpperCase()+' #'+(i+1)+'</small><h3>'+esc(o.product)+'</h3><span class="bb">BATCH # '+esc(dept==='prod'?prodBatch(o.batch):o.batch)+'</span></div><div class="tb"><b>'+esc(o.tank)+'</b><span>TANK GAL</span></div></div>'+(dept==='prod'?'<div class="pq"><div><b>'+esc(o.quart)+'</b><small>QUARTS / '+boxes(num(o.quart))+' BOXES</small></div><div><b>'+esc(o.gallon)+'</b><small>1 GAL / '+boxes(num(o.gallon))+' BOXES</small></div><div><b>'+esc(o.five)+'</b><small>5 GAL</small></div></div><p>'+esc(o.prodNote||'')+'</p>':'<p>'+esc(o.batchNote||'Prepare batch for production.')+'</p>')+'<div class="ck">'+(o[dept+'Checked']?'✓':'□')+' '+(dept==='prod'?'Labels • Pallets • Containers':'Raw materials ready')+'</div><div class="st">STATUS: <b>'+statusText(o[dept+'Status']).replace(/[✓●○]/g,'')+(o.held?' • HOLD':'')+'</b></div></div>').join('');let h='<!doctype html><html><head><meta charset="utf-8"><title>Full Day</title><style>@page{size:Letter;margin:.22in}*{box-sizing:border-box}body{font-family:Arial;color:#111;margin:0}.head{border:1.5px solid #111;border-radius:8px;background:#eee;padding:7px 9px;display:flex;justify-content:space-between;align-items:end}.head h1{font-size:15pt;margin:0}.head p{margin:2px 0 0;font-size:7pt}.cols{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:7px;transform-origin:top left;zoom:'+scale+'}.sh{background:#e7e7e7;border:1px solid #333;border-radius:6px;padding:5px 7px;font-size:9pt;font-weight:bold;margin-bottom:5px}.j{border:1px solid #555;border-radius:7px;padding:6px;margin-bottom:5px;break-inside:avoid}.jt{display:flex;justify-content:space-between;gap:5px}.jt small{font-size:5.8pt;font-weight:bold}.jt h3{font-size:10pt;margin:1px 0}.bb{border:1px solid #111;background:#eee;border-radius:4px;padding:2px 4px;font-size:6pt;font-weight:bold}.tb{border:1px solid #111;background:#f1f1f1;border-radius:5px;padding:3px 5px;text-align:center;min-width:48px}.tb b{display:block;font-size:9pt}.tb span{font-size:5pt}.pq{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:4px}.pq div{border:1px solid #999;background:#f7f7f7;border-radius:4px;padding:3px;text-align:center}.pq b{display:block;font-size:9pt}.pq small{font-size:5pt}p{font-size:6.5pt;margin:4px 0;padding:3px;border-left:2px solid #555;background:#fafafa}.ck,.st{font-size:5.8pt;border-top:1px solid #bbb;padding-top:3px;margin-top:3px}.st{display:flex;justify-content:space-between}button{position:fixed;right:8px;top:8px}@media print{button{display:none}}</style></head><body><button onclick="print()">Print / Save PDF</button><div class="head"><div><h1>FACTORY DAILY WORK SHEET</h1><p>'+pretty()+'</p></div><b>MANAGER COPY</b></div><div class="cols"><section><div class="sh">BATCH MAKER</div>'+rows('batch')+'</section><section><div class="sh">PRODUCTION / FILLING</div>'+rows('prod')+'</section></div><script>setTimeout(()=>print(),300)<\/script></body></html>';let w=open('','_blank');w.document.write(h);w.document.close()}
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
seed();tick();setInterval(tick,30000);setView(view);render();
</script></body></html>
